# Live production — run: docker compose -f docker-compose.prod.yml up --build -d
#
# Uses .env.prod. Run migrations in CI before deploy (they are not run by this container).

name: sandbox-backend-prod

services:
  app:
    build: .
    container_name: sandbox-backend-prod
    labels:
      logging.service: sandbox-backend
    restart: unless-stopped
    init: true
    ports:
      - "8000:8000"
    env_file:
      - .env.prod
    environment:
      ENVIRONMENT: production
      DB_ECHO: "false"
      LOG_JSON: "true"
      COOKIE_SECURE: "true"
      POOL_PRE_PING: "true"
      REDIS_URL: redis://redis:6379/0
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --workers 2
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: sandbox-backend-prod-redis
    restart: unless-stopped
    # Only the refresh cooldown lives here, so persistence is disabled. Not published to the host.
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
