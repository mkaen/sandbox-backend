# Local development — hot reload, optional local Postgres.
# Production live: docker compose -f docker-compose.prod.yml up --build -d

name: sandbox-backend-dev

services:
  app:
    build: .
    container_name: sandbox-backend-dev
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ENVIRONMENT: development
      COOKIE_SECURE: "false"
    volumes:
      - ./src:/app/src:ro
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
        required: false

  db:
    profiles: ["local-db"]
    image: postgres:16-alpine
    ports:
      # Host uses 5433 (avoids a local Postgres on 5432).
      # In .env use 127.0.0.1:5433 — the app rewrites it to db:5432 inside Docker.
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sandbox
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sandbox"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
