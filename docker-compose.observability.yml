# Local log stack: Alloy → Loki → Grafana
#
# Prerequisites: app container running (dev or prod compose).
#   docker compose up --build -d
#   # or
#   docker compose -f docker-compose.prod.yml up --build -d
#
# Start observability:
#   docker compose -f docker-compose.observability.yml up -d
#
# Grafana:  http://localhost:3000  (admin / admin)
# Alloy UI: http://localhost:12345

name: sandbox-observability

services:
  loki:
    image: grafana/loki:3.4.2
    container_name: sandbox-loki
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  grafana:
    image: grafana/grafana:11.5.2
    container_name: sandbox-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      loki:
        condition: service_healthy

  alloy:
    image: grafana/alloy:v1.6.1
    container_name: sandbox-alloy
    ports:
      - "12345:12345"
    volumes:
      - ./observability/alloy.config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_healthy

volumes:
  loki_data:
  grafana_data:
  alloy_data:
